name: OGP cache

# Refreshes src/data/ogp.json (and public/ogp/) and opens a pull request with
# the result. The build itself still never fetches: it reads the committed
# cache, so a deploy is never at the mercy of a third-party host. This
# workflow is the "somewhere with network access" that `pnpm ogp` needs.

on:
  workflow_dispatch:
    inputs:
      all:
        description: 'Re-fetch every URL, not only the ones missing from the cache. Needed to pick up og:image for entries cached without one, and to refresh titles that have since changed.'
        type: boolean
        default: false
  push:
    branches: [master]
    # Only articles can introduce a new URL to fetch. The cache and the images
    # this workflow writes are not under content/, so merging its own pull
    # request cannot trigger it again.
    paths: ['content/**']

permissions:
  contents: write
  pull-requests: write

# One refresh at a time — two runs would race on the same branch.
concurrency:
  group: ogp-cache

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh the cache
        # The script exits 0 when a fetch fails — a URL with no entry renders
        # as an ordinary link, which is the intended fallback — so the run is
        # green either way. The log is the record of what could not be reached.
        run: |
          pnpm ogp ${{ inputs.all && '--all' || '' }} | tee ogp.log
          {
            echo '```'
            cat ogp.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm ogp.log

      - name: Check for changes
        id: changes
        # git diff alone would miss newly downloaded images, which are
        # untracked until they are added.
        run: |
          if [ -z "$(git status --porcelain -- src/data/ogp.json public/ogp)" ]; then
            echo 'result=none' >> "$GITHUB_OUTPUT"
          else
            echo 'result=some' >> "$GITHUB_OUTPUT"
          fi

      - name: Open a pull request
        if: steps.changes.outputs.result == 'some'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c chore/ogp-cache
          git add src/data/ogp.json public/ogp
          git commit -m 'chore: refresh the OGP cache'
          git push --force origin chore/ogp-cache

          # Reuses the branch, so an open pull request just gains a commit.
          # `.[].number` rather than `.[0].number`: the latter prints "null"
          # for an empty list, which is not an empty string, and the pull
          # request would never be opened.
          if [ -z "$(gh pr list --head chore/ogp-cache --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --base master \
              --head chore/ogp-cache \
              --title 'chore: refresh the OGP cache' \
              --body 'Generated by the OGP cache workflow. See the run summary for which URLs were fetched and which failed; a URL that failed stays an ordinary link in the build.'
          fi
